name: Reflector A2A Host Proof
on:
  push:
    branches: ["claude/a2a-service-host"]
  pull_request:
    paths: ["services/a2a/**", ".github/workflows/a2a-host.yml"]
permissions:
  contents: read
jobs:
  a2a-host-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build services/a2a/ReflectorAgent.Host/ReflectorAgent.Host.csproj -c Release --nologo
      - run: dotnet build services/a2a/ReflectorAgent.Probe/ReflectorAgent.Probe.csproj -c Release --nologo
      - name: Start host
        env:
          ASPNETCORE_URLS: http://127.0.0.1:5095
          A2A_PUBLIC_BASE_URL: http://127.0.0.1:5095
        run: |
          dotnet run --project services/a2a/ReflectorAgent.Host/ReflectorAgent.Host.csproj -c Release --no-build > /tmp/a2a.log 2>&1 &
          echo $! > /tmp/a2a.pid
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:5095/healthz > /tmp/health.json && { cat /tmp/health.json; exit 0; }; sleep 1; done
          cat /tmp/a2a.log; exit 1
      - name: Verify agent card
        run: |
          curl --fail --silent http://127.0.0.1:5095/.well-known/agent-card.json | tee /tmp/card.json
          python3 - <<'PY'
          import json
          c=json.load(open('/tmp/card.json')); assert c['name']=='PMCR-O Reflector Agent'; print('PASS agent-card discovery')
          PY
      - name: Invoke A2A
        run: dotnet run --project services/a2a/ReflectorAgent.Probe/ReflectorAgent.Probe.csproj -c Release --no-build -- http://127.0.0.1:5095
      - name: Stop host
        if: always()
        run: test ! -f /tmp/a2a.pid || kill "$(cat /tmp/a2a.pid)" || true
